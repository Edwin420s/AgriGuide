services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agriguide
      POSTGRES_USER: agriguide
      POSTGRES_PASSWORD: agriguide
    ports: ["5432:5432"]
    volumes: ["agriguide_pg:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agriguide:agriguide@db:5432/agriguide
      CORS_ORIGINS: http://localhost:5173
      OMEGA_MODE: local
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  agriguide_pg:
